name: Server CI
on:
  push:
    branches: [development, main]
    paths:
      - 'server/**'
      - 'orm/**'
      - 'pyproject.toml'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [development, main]
    paths:
      - 'server/**'
      - 'orm/**'
      - 'pyproject.toml'
      - '.github/workflows/server-ci.yml'

# Neither job writes to the repository: `test` runs pytest and appends to
# $GITHUB_STEP_SUMMARY (a file, not a token scope), and `schema-sync` only
# reads the checkout. Pin read-only rather than inherit the repository default.
permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover diffs against origin/<base>, which checkout's default
          # depth of 1 never fetches. Measured against diff-cover 10.5.1: an
          # absent compare branch raises ValueError and exits 1, so without this
          # the gate would fail on every PR -- a permanently red check that
          # measures nothing, rather than a silent green one.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/test-requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -e ./orm
          pip install -r server/test-requirements.txt
      - run: pytest --cov --cov-report=xml --cov-report=term

      - name: Patch coverage (80% floor on changed lines)
        # base_ref is empty on push events, which would make --compare-branch
        # origin/ and fail every push to development.
        if: github.event_name == 'pull_request'
        run: |
          status=0
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80 \
            --format "markdown:diff-cover.md" || status=$?
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

  schema-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.27
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: eyened_database
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s
    env:
      EYENED_DATABASE_USER: root
      EYENED_DATABASE_PASSWORD: ci-root
      EYENED_DATABASE_HOST: 127.0.0.1
      EYENED_DATABASE_PORT: "3306"
      EYENED_DATABASE_DATABASE: eyened_database
      EYENED_ALEMBIC_ASSUME_YES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orm/setup.py
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client
      - run: |
          python -m pip install --upgrade pip
          pip install -e ./orm
      - name: Load the frozen baseline
        env:
          MYSQL_PWD: ci-root
        run: mysql -h 127.0.0.1 -P 3306 -uroot eyened_database < orm/migrations/baseline/baseline.sql
      - name: Replay revisions added after the baseline
        working-directory: orm/migrations
        run: alembic upgrade head
      - name: Assert models and migrations agree
        working-directory: orm/migrations
        run: alembic check
