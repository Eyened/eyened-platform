name: eyened-platform

services:

  redis:
    image: redis:7-alpine
    env_file: .env
    environment:
      REDIS_PASSWORD: ${EYENED_REDIS_PASSWORD:?}
    ports:
      - "${EYENED_REDIS_PUBLISH_PORT:-6379}:6379"
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.server
    env_file: .env
    environment:
      EYENED_REDIS_HOST: redis
      EYENED_REDIS_PORT: "6379"
      EYENED_REDIS_PASSWORD: ${EYENED_REDIS_PASSWORD:?}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health?src=docker-compose', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      # All storage volumes are volumes subpath mounts in ohk_researchdata
      # Zarr segmentations
      - type: volume
        source: ohk_researchdata
        target: /storage/segmentations.zarr
        volume:
          nocopy: true
          subpath: "${OHK_RESEARCHDATA_STORAGE_PATH}/segmentations.zarr"
      # Thumbnails (needed for image thumbnail generation)
      - type: volume
        source: ohk_researchdata
        target: /storage/thumbnails
        volume:
          nocopy: true
          subpath: "${OHK_RESEARCHDATA_STORAGE_PATH}/thumbnails"
      # Images (needed for eorm commands)
      - type: volume
        source: ohk_researchdata
        target: /ohkrdb-images
        read_only: true
        volume:
          nocopy: true
          subpath: "${OHK_RESEARCHDATA_IMAGES_PATH}"

  client:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.client

  fileserver:
    env_file: .env
    image: nginx:latest
    ports:
      - "${PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
    volumes:
      # nginx configuration
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # All storage volumes are volumes subpath mounts in ohk_researchdata
      # Images
      - type: volume
        source: ohk_researchdata
        target: /ohkrdb-images
        read_only: true
        volume:
          nocopy: true
          subpath: "${OHK_RESEARCHDATA_IMAGES_PATH}"
      # Thumbnails
      - type: volume
        source: ohk_researchdata
        target: /storage/thumbnails
        read_only: true
        volume:
          nocopy: true
          subpath: "${OHK_RESEARCHDATA_STORAGE_PATH}/thumbnails"

volumes:
  ohk_researchdata:
    driver: local
    driver_opts:
      type: cifs
      device: "${OHK_RESEARCHDATA_CIFS_SHARE}"
      o: "username=${OHK_RESEARCHDATA_CIFS_USERNAME},password=${OHK_RESEARCHDATA_CIFS_PASSWORD}"
