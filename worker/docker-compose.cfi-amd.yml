# Dedicated worker for the AMD segmentation model queue (`cfi-amd`).
# Configure Redis/DB/storage in `worker/.env` (see `.env.example`).
#
#   cd worker && docker compose -f docker-compose.cfi-amd.yml up --build
#
# GPU enabled by default (`gpus: all`). Notebook one-shot uses `docker run --gpus` via docker_runner.
#
# One-shot (no DB), from a notebook on the host:
#   from eyened_orm.inference.docker_runner import predict_cfi_amd
#   maps = predict_cfi_amd("/path/to/fundus.png")  # or RGB uint8 ndarray (H, W, 3)

name: eyened-platform-worker-cfi-amd

services:
  worker-cfi-amd:
    build:
      context: ..
      dockerfile: worker/Dockerfile.cfi-amd
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      EYENED_RQ_WORKER_QUEUES: cfi-amd
      CFI_AMD_MODELS_DIR: /models/cfi-amd
    volumes:
      - ${EYENED_STORAGE_ROOT:?}:${EYENED_STORAGE_ROOT:?}
      - /mnt/oogergo:/mnt/oogergo:ro
      - /mnt/genr:/mnt/genr:ro
    restart: unless-stopped
    gpus: all

