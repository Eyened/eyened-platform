# Dedicated worker for OCT layer segmentation (nnU-Net, queue ``layer-segmentation``).
# Configure Redis/DB/storage in `worker/.env` (see `.env.example`).
#
#   cd worker && docker compose -f docker-compose.layersegmentation.yml up --build
#
# GPU enabled by default (`gpus: all`). Notebook one-shot uses `docker run --gpus` via docker_runner.
#
# Queue a job from the API:
#   POST /api/import/run_layer_segmentation  {"image_ids": [...]}
#
# One-shot (no DB), from a notebook on the host:
#   from eyened_orm.inference.docker_runner import predict_layers
#   layers = predict_layers("/path/to/volume.npy")  # or uint8 ndarray (D, H, W)

name: eyened-platform-worker-layersegmentation

services:
  worker-layersegmentation:
    build:
      context: ..
      dockerfile: worker/Dockerfile.layersegmentation
    env_file: .env.dev
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      EYENED_RQ_WORKER_QUEUES: layer-segmentation
      NNUNET_RESULTS: /nnUNet_results
      nnUNet_results: /nnUNet_results
      nnUNet_raw: /nnUNet_results
      nnUNet_preprocessed: /nnUNet_results
    volumes:
      - ${EYENED_STORAGE_ROOT:?}:${EYENED_STORAGE_ROOT:?}
      - /mnt/oogergo:/mnt/oogergo:ro
      - /mnt/genr:/mnt/genr:ro
    restart: unless-stopped
    gpus: all
