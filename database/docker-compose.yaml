name: eyeneed-bundle-database

services:
  database:
    image: mysql:8.0.27
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eyened_database}
      MYSQL_USER: ${MYSQL_USER:-eyened_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_password}
    ports:
      - "${EYENED_DATABASE_PORT:-3306}:3306"
    volumes:
      - ${EYENED_DB_DATA_PATH:-./.local/mysql}:/var/lib/mysql

  # optional: adminer for simple database management in the browser
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "${EYENED_ADMINER_PORT:-8080}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=database

  # optional: xtrabackup for fast database backups
  xtrabackup:
    image: percona/percona-xtrabackup:8.0
    profiles: ["backup"]
    volumes:
      - ${EYENED_DB_DATA_PATH:-./.local/mysql}:/var/lib/mysql
