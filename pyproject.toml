[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "server",
    "orm",
]

[tool.coverage.run]
# "orm", NOT "orm/eyened_orm" -- do not narrow this, however much it looks like
# an imprecision. The XML report names each file relative to whichever `source`
# root contains it, so with "orm/eyened_orm" both server/db.py and
# orm/eyened_orm/db.py are written as "db.py". Cobertura keeps one of the pair,
# and diff-cover then registers that single entry under BOTH source-joined
# paths -- so it answers questions about the ORM file with the server file's
# coverage. Measured: a change to orm/eyened_orm/db.py reported "No lines with
# coverage information in this diff" and passed, while an identical change to a
# uniquely-named ORM file was correctly failed. Six paths collide this way,
# including db.py and config.py. Rooting at "orm" keeps the eyened_orm/ prefix
# and makes every name unique. Cost: orm/setup.py enters the denominator.
# orm/notebooks/ does NOT, because it lacks an __init__.py (coverage's
# directory walk skips it) and nothing imports it either. orm/migrations/ also
# lacks an __init__.py, but that is not enough to keep it out: coverage
# records any file that gets imported, walk or not, and
# orm/eyened_orm/tests/test_migration_chain.py calls
# ScriptDirectory.from_config(config).get_heads(), which imports every file
# under versions/ to build the revision map. Each revision script's
# module-level lines are therefore measured, even though its upgrade() body
# never runs. That is why the Alembic-revision exclusion lives in the
# diff-cover invocation in .github/workflows/server-ci.yml instead of in
# `omit` here: `omit` controls what coverage.py *measures* -- an omitted file
# is dropped from coverage.xml entirely, for every consumer of that report,
# not just this one gate. diff-cover's `--exclude` instead filters
# *findings*: coverage.xml still carries the file's real numbers, and only
# the one patch-coverage step is told to ignore them when deciding whether a
# PR passes. This is not because server/tests/test_coverage_omissions.py
# would catch the omission: its direction 1 only rejects a module that
# imports cleanly or fails on repo code. In CI, orm/ is never on sys.path
# (the workflow sets no PYTHONPATH; the editable install maps only
# `eyened_orm`), so `_module_name` reduces orm/migrations/**/*.py to
# `migrations.*`, which fails with `ModuleNotFoundError('migrations')` -- a
# missing top-level name that is not repo code, which direction 1 treats as
# an absent third-party package and accepts. The guard would reject the
# omission only in a shell that happens to have orm/ on sys.path (e.g. a
# local `PYTHONPATH=$PWD/orm` run), which is not CI's condition. Verified by
# replaying direction 1 against every file under orm/migrations/ both ways.
source = ["server", "orm"]
omit = [
    "*/tests/*",
    "*/conftest.py",
    # These six cannot be imported without torch, which CI deliberately does not
    # install. Five import it at module scope; docker_runner.py fails
    # transitively, through cfi_amd_segmentation and layer_segmentation -- its
    # own "import torch" is a string it runs inside a container, not an import.
    # Their siblings under inference/ import
    # cleanly and are therefore NOT omitted -- the criterion is "fails to
    # import because an external package is absent", enforced by
    # server/tests/test_coverage_omissions.py.
    "orm/eyened_orm/inference/cfi_amd_segmentation.py",
    "orm/eyened_orm/inference/cfi_keypoints.py",
    "orm/eyened_orm/inference/cfi_odfd.py",
    "orm/eyened_orm/inference/cfi_quality.py",
    "orm/eyened_orm/inference/docker_runner.py",
    "orm/eyened_orm/inference/layer_segmentation.py",
]
