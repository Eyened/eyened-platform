# Production frontend: serve the SPA baked into the fileserver image by
# Dockerfile.fileserver. No client container exists in production.
# Mounted by compose.prod.yaml as /etc/nginx/client.d/client.conf.

# Build assets carry a content hash in the filename, so the bytes behind a
# given URL never change and the response can be cached indefinitely. Without
# this they are served by the try_files below with only Last-Modified/ETag,
# which costs a conditional request per asset on every single page load.
# A longer prefix than `/`, so nginx picks it first.
location /_app/immutable/ {
    root /usr/share/nginx/html;
    # One header, not `expires 1y` plus an add_header — those emit two
    # Cache-Control lines that clients then have to recombine.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    root /usr/share/nginx/html;
    # adapter-static is configured with fallback: "index.html", so every
    # client-side route must fall back to it rather than 404.
    try_files $uri $uri/ /index.html;
}
