# Development frontend: proxy to the vite dev server.
# Mounted by compose.dev.yaml as /etc/nginx/client.d/client.conf.
location / {
    # See the /api/ location in default.conf.template for the full
    # rationale: the upstream host is built from a variable so the
    # `resolver` directive can re-resolve it lazily on every request,
    # instead of nginx caching a stale IP once the client container gets
    # recreated. Do not collapse this back to a bare hostname. No URI
    # path is appended to $client_upstream, so the request URI passes
    # through unchanged.
    set $client_upstream client;
    proxy_pass http://$client_upstream:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_scheme;

    # Vite HMR needs the websocket upgrade.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
}
