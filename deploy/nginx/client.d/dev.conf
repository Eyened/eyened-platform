# Development frontend: proxy to the vite dev server.
# Mounted by compose.dev.yaml as /etc/nginx/client.d/client.conf.
location / {
    # Same reasoning as $api_upstream in default.conf.template: a
    # variable-built proxy_pass target is what makes the `resolver`
    # directive lazily re-resolve this on every request instead of once
    # at config-load. A literal `proxy_pass http://client:5173;` would
    # cache client's IP for the life of the nginx process, so recreating
    # the client container would 502 every / request until nginx is
    # bounced. Do not collapse this back to a literal hostname. No URI
    # path is appended to $client_upstream, so the request URI passes
    # through unchanged, identically to the literal form.
    set $client_upstream client;
    proxy_pass http://$client_upstream:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Vite HMR needs the websocket upgrade.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
}
