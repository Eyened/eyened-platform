# Keycloak OIDC override for local development.
#
# Layer it on top of a base dev stack (run from the dev/ folder):
#   docker compose -f docker-compose.yml -f keycloak/docker-compose.keycloak.yml up
# or use the helper:
#   ./keycloak/up.sh up -d
#
# The base stack stays OIDC-agnostic; this file adds Keycloak and wires the
# server's OIDC URLs from DEV_PUBLIC_HOST. The remaining OIDC settings
# (client id/secret, provider name, account creation) come from .env.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    env_file: .env
    entrypoint: ["/bin/bash", "/opt/keycloak/entrypoint.sh"]
    environment:
      KC_HOSTNAME: ${DEV_PUBLIC_HOST:-localhost}
      KC_HOSTNAME_PORT: ${DEV_KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${DEV_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/entrypoint.sh:/opt/keycloak/entrypoint.sh:ro
      - ./keycloak/realm-eyened-dev.json.template:/opt/keycloak/import-template/realm-eyened-dev.json:ro

  server:
    extra_hosts:
      - "${DEV_PUBLIC_HOST:-localhost}:host-gateway"
    environment:
      EYENED_OIDC_METADATA_URL: http://${DEV_PUBLIC_HOST:-localhost}:${DEV_KEYCLOAK_PORT:-8180}/realms/eyened-dev/.well-known/openid-configuration
      EYENED_OIDC_REDIRECT_URL: http://${DEV_PUBLIC_HOST:-localhost}:${DEV_NGINX_PORT:?}/users/oidc-callback
      EYENED_OIDC_ADDITIONAL_TOKEN_VALIDATIONS: iss=http://${DEV_PUBLIC_HOST:-localhost}:${DEV_KEYCLOAK_PORT:-8180}/realms/eyened-dev
    depends_on:
      keycloak:
        condition: service_started
